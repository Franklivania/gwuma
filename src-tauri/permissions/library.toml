[[permission]]
identifier = "allow-list-folders"
description = "Allows listing watched folders from SQLite."
commands.allow = ["list_folders"]

[[permission]]
identifier = "allow-add-folder"
description = "Allows adding a watched folder to SQLite."
commands.allow = ["add_folder"]

[[permission]]
identifier = "allow-remove-folder"
description = "Allows removing a watched folder from SQLite."
commands.allow = ["remove_folder"]

[[permission]]
identifier = "allow-refresh-library"
description = "Allows scanning folders and reconciling books in SQLite."
commands.allow = ["refresh_library"]

[[permission]]
identifier = "allow-read-text-file"
description = "Allows reading a .txt book file for the text reader."
commands.allow = ["read_text_file"]

[[permission]]
identifier = "allow-read-file-bytes"
description = "Allows reading PDF/EPUB file bytes for the reader engines."
commands.allow = ["read_file_bytes"]

[[permission]]
identifier = "allow-open-book"
description = "Allows opening a book and updating last_opened."
commands.allow = ["open_book"]

[[permission]]
identifier = "allow-save-reading-state"
description = "Allows saving reading progress and position."
commands.allow = ["save_reading_state"]

[[permission]]
identifier = "allow-ping-reading-session"
description = "Allows heartbeat updates for an active reading session."
commands.allow = ["ping_reading_session"]

[[permission]]
identifier = "allow-end-reading-session"
description = "Allows ending an active reading session."
commands.allow = ["end_reading_session"]

[[permission]]
identifier = "allow-get-statistics-summary"
description = "Allows loading aggregated reading statistics for a period."
commands.allow = ["get_statistics_summary"]

[[permission]]
identifier = "allow-list-book-stats"
description = "Allows listing per-book reading stats snapshots."
commands.allow = ["list_book_stats"]

[[permission]]
identifier = "allow-search-library"
description = "Allows searching books by title, author, or indexed phrases."
commands.allow = ["search_library"]

[[permission]]
identifier = "allow-ensure-book-indexed"
description = "Allows ensuring a book text index exists for search."
commands.allow = ["ensure_book_indexed"]

[[permission]]
identifier = "allow-upsert-book-text-chunks"
description = "Allows writing extracted text chunks for search indexing."
commands.allow = ["upsert_book_text_chunks"]

[[permission]]
identifier = "allow-set-book-favourite"
description = "Allows toggling a book favourite flag."
commands.allow = ["set_book_favourite"]

[[permission]]
identifier = "allow-get-setting"
description = "Allows reading a setting from SQLite."
commands.allow = ["get_setting"]

[[permission]]
identifier = "allow-set-setting"
description = "Allows writing a setting to SQLite."
commands.allow = ["set_setting"]

[[permission]]
identifier = "allow-save-cover-bytes"
description = "Allows saving a generated book cover image under app data."
commands.allow = ["save_cover_bytes"]

[[permission]]
identifier = "allow-list-books-missing-pdf-covers"
description = "Allows listing PDF books that still need cover thumbnails."
commands.allow = ["list_books_missing_pdf_covers"]

[[permission]]
identifier = "allow-load-locations-cache"
description = "Allows reading cached EPUB locations from app data."
commands.allow = ["load_locations_cache"]

[[permission]]
identifier = "allow-save-locations-cache"
description = "Allows writing cached EPUB locations to app data."
commands.allow = ["save_locations_cache"]
